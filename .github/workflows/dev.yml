name: DEV - Build and Push Docker Image to DEV

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository with full history to enable accurate change detection
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Detect changes since the last commit on dev
      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'src/**'
              - 'angular.json'
              - 'package*.json'
              - 'tsconfig*.json'
              - 'Dockerfile'
      # If no changes detected in either frontend or backend, skip the rest of the steps
      - name: No changes detected
        if: steps.changes.outputs.frontend != 'true' && steps.changes.outputs.backend != 'true'
        run: echo "No frontend or backend changes detected. Skipping builds."
      # Setup Docker Buildx for advanced caching and multi-platform builds
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Login to Docker Hub using secrets stored in GitHub for authentication
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Build and push Docker images for frontend and backend if changes are detected, using caching to speed up builds and tagging with both 'latest' and the specific commit SHA for traceability
      # Frontend
      - name: Build and Push Frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: midwestmackey/midwestmackey.com:dev
          cache-from: type=registry,ref=midwestmackey/midwestmackey.com:buildcache
          cache-to: type=registry,ref=midwestmackey/midwestmackey.com:buildcache,mode=max
      # Backend
      - name: Build and Push Twitch Backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: midwestmackey/backend:dev
          cache-from: type=registry,ref=midwestmackey/backend:buildcache
          cache-to: type=registry,ref=midwestmackey/backend:buildcache,mode=max