name: DEV - Build and Push Docker Image to DEV

on:
  push:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Detect changes (controls builds only)
      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'src/**'
              - 'angular.json'
              - 'package*.json'
              - 'tsconfig*.json'
              - 'Dockerfile'

      # 3. Skip early if nothing changed
      - name: No changes detected
        if: steps.changes.outputs.frontend != 'true' && steps.changes.outputs.backend != 'true'
        run: |
          echo "No frontend or backend changes detected. Skipping builds."
          exit 0

      # 4. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build and Push Frontend (DEV)
      - name: Build and Push Frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            midwestmackey/midwestmackey.com:dev
          cache-from: type=registry,ref=midwestmackey/midwestmackey.com:dev-buildcache
          cache-to: type=registry,ref=midwestmackey/midwestmackey.com:dev-buildcache,mode=max

      # 7. Build and Push Backend (DEV)
      - name: Build and Push Backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            midwestmackey/backend:dev
          cache-from: type=registry,ref=midwestmackey/backend:dev-buildcache
          cache-to: type=registry,ref=midwestmackey/backend:dev-buildcache,mode=max