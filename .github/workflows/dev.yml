name: DEV - Build and Push Docker Image to DEV

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # Build and push Angular frontend
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: midwestmackey/midwestmackey.com:dev

      # Build and push Twitch backend
      - name: Build and Push Twitch Backend
        uses: docker/build-push-action@v5
        with:
          context: ./twitch-backend
          push: true
          tags: midwestmackey/twitch-backend:dev
