name: MAIN - Build and Push Docker Image to PRODUCTION

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Angular frontend
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            midwestmackey/midwestmackey.com:latest
            midwestmackey/midwestmackey.com:${{ github.sha }}
            
      # Build and push Twitch backend
      - name: Build and Push Twitch Backend
        uses: docker/build-push-action@v5
        with:
          context: ./twitch-backend
          file: Dockerfile
          push: true
          tags: |
            midwestmackey/twitch-backend:latest
            midwestmackey/twitch-backend:${{ github.sha }}
